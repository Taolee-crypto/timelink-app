name: TimeLink Player V5 parser and Windows installer
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/player-validation.yml'
      - '.github/workflows/build.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/player-validation.yml'
permissions:
  contents: read
jobs:
  parser-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Produce Windows desktop installer without publishing release
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TimeLink-Player-Windows-validation
          path: dist/*.exe
          if-no-files-found: error
