name: Publish v1.1.8 integrated player assets
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'Taolee-crypto/timelink-app'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build final integrated player
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: integrated-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: integrated-*
          merge-multiple: true
          path: release-assets
      - name: Publish immutable integrated assets to v1.1.8
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          test "$VERSION" = "1.1.8"
          TAG="v$VERSION"
          gh release view "$TAG" >/dev/null
          test -s "release-assets/TimeLink-Player-Setup-$VERSION.exe"
          test -s "release-assets/TimeLink-Player-$VERSION-arm64.dmg"
          test -s "release-assets/TimeLink-Player-$VERSION.AppImage"
          test -s "release-assets/TimeLink-Player-$VERSION.deb"
          cp "release-assets/TimeLink-Player-Setup-$VERSION.exe" "release-assets/TimeLink-Player-Setup-$VERSION-integrated.exe"
          cp "release-assets/TimeLink-Player-$VERSION-arm64.dmg" "release-assets/TimeLink-Player-$VERSION-integrated-arm64.dmg"
          cp "release-assets/TimeLink-Player-$VERSION.AppImage" "release-assets/TimeLink-Player-$VERSION-integrated.AppImage"
          cp "release-assets/TimeLink-Player-$VERSION.deb" "release-assets/TimeLink-Player-$VERSION-integrated.deb"
          for asset in             "TimeLink-Player-Setup-$VERSION-integrated.exe"             "TimeLink-Player-$VERSION-integrated-arm64.dmg"             "TimeLink-Player-$VERSION-integrated.AppImage"             "TimeLink-Player-$VERSION-integrated.deb"; do
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
              echo "::error::$asset already exists; refusing to replace immutable asset."
              exit 1
            fi
          done
          gh release upload "$TAG"             "release-assets/TimeLink-Player-Setup-$VERSION-integrated.exe"             "release-assets/TimeLink-Player-$VERSION-integrated-arm64.dmg"             "release-assets/TimeLink-Player-$VERSION-integrated.AppImage"             "release-assets/TimeLink-Player-$VERSION-integrated.deb"
