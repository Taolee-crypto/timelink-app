name: Build TimeLink Player (immutable releases)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build without publishing any GitHub Release
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: timelink-player-${{ matrix.platform }}-${{ github.sha }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: timelink-player-immutable-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: timelink-player-*-${{ github.sha }}
          merge-multiple: true
          path: release-assets
      - name: Validate exact versioned installers and decide whether to publish
        id: release-check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          test -s "release-assets/TimeLink-Player-Setup-$VERSION.exe"
          test -s "release-assets/TimeLink-Player-$VERSION-arm64.dmg"
          test -s "release-assets/TimeLink-Player-$VERSION.AppImage"
          test -s "release-assets/TimeLink-Player-$VERSION.deb"
          find release-assets -maxdepth 1 -type f -size +1M -print
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Version $TAG was previously released; no replacement permitted."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A tag without an existing release must point to the exact verified source.
          EXISTING_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ] && [ "$EXISTING_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Tag points to a different commit; refusing to retarget."
            exit 1
          fi
          if [ -z "$EXISTING_SHA" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Publish new tag and installers without overwriting existing assets
        if: steps.release-check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release-check.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release-assets/*.exe release-assets/*.dmg release-assets/*.AppImage release-assets/*.deb \
            --target "$GITHUB_SHA" \
            --title "TimeLink Player $RELEASE_TAG" \
            --notes "Desktop login and authenticated online playback synchronization corrected. Offline grant issuance and offline TL settlement remain unavailable; this release does not claim complete offline playback."
