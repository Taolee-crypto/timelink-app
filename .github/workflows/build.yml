name: Build TimeLink Player

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify Windows installer matches package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expected = "dist/TimeLink-Player-Setup-$version.exe"
          if (!(Test-Path $expected)) { throw "Installer missing or version mismatch: $expected" }
          if ((Get-Item $expected).Length -lt 1000000) { throw "Installer is unexpectedly small: $expected" }
          Write-Host "Verified installer: $expected"
      - uses: actions/upload-artifact@v4
        with:
          name: TimeLink-Player-Setup-1.1.4-Windows
          path: dist/TimeLink-Player-Setup-1.1.4.exe
          if-no-files-found: error
          retention-days: 30

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: TimeLink-Player-1.1.4-macOS
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: TimeLink-Player-1.1.4-Linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 30

  publish-v114:
    name: Publish verified v1.1.4 installers
    needs: [build-win, build-mac, build-linux]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: timelink-player-v114-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: TimeLink-Player-*
          path: release-assets
          merge-multiple: true
      - name: Check real installers before publishing
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "1.1.4"
          test -s release-assets/TimeLink-Player-Setup-1.1.4.exe
          find release-assets -maxdepth 1 -name 'TimeLink-Player-1.1.4-*.dmg' -size +1M | grep -q .
          test -s release-assets/TimeLink-Player-1.1.4.AppImage
          test -s release-assets/TimeLink-Player-1.1.4.deb
          ls -lh release-assets/
      - name: Publish exact installers for official download page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view v1.1.4 >/dev/null 2>&1; then
            gh release create v1.1.4 --target "$GITHUB_SHA" --title "TimeLink Player v1.1.4" --notes "Desktop player: Windows, macOS, Linux. Online TL3 V5 playback requires server authorization. Fully offline TL3 playback and offline TL settlement are not yet supported."
          fi
          gh release upload v1.1.4 release-assets/TimeLink-Player-Setup-1.1.4.exe release-assets/TimeLink-Player-1.1.4-*.dmg release-assets/TimeLink-Player-1.1.4.AppImage release-assets/TimeLink-Player-1.1.4.deb --clobber
