name: Build TimeLink Player (immutable releases)
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build without publishing any GitHub Release
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: timelink-player-${{ matrix.platform }}-${{ github.sha }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: timelink-player-*-${{ github.sha }}
          merge-multiple: true
          path: release-assets
      - name: Verify tag matches package and all four installer binaries exist
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
          test -s "release-assets/TimeLink-Player-Setup-${GITHUB_REF_NAME#v}.exe"
          test -s "release-assets/TimeLink-Player-${GITHUB_REF_NAME#v}-arm64.dmg"
          test -s "release-assets/TimeLink-Player-${GITHUB_REF_NAME#v}.AppImage"
          test -s "release-assets/TimeLink-Player-${GITHUB_REF_NAME#v}.deb"
          find release-assets -maxdepth 1 -type f -size +1M -print
      - name: Refuse to replace any previously published release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::Release already exists. Published installers are immutable."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/*.exe release-assets/*.dmg release-assets/*.AppImage release-assets/*.deb \
            --target "$GITHUB_SHA" \
            --title "TimeLink Player $GITHUB_REF_NAME" \
            --notes "Desktop installer release. Offline playback is available only when signed offline licensing and server settlement are implemented, independently tested and enabled."
