name: Build TimeLink Player

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify Windows installer matches package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expected = "dist/TimeLink-Player-Setup-$version.exe"
          if (!(Test-Path $expected)) { throw "Installer missing or version mismatch: $expected" }
          if ((Get-Item $expected).Length -lt 1000000) { throw "Installer is unexpectedly small: $expected" }
          Write-Host "Verified installer: $expected"
      - uses: actions/upload-artifact@v4
        with:
          name: TimeLink-Player-Setup-1.1.4-Windows
          path: dist/TimeLink-Player-Setup-1.1.4.exe
          if-no-files-found: error
          retention-days: 30
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*.exe
          token: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*.dmg
          token: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
          token: ${{ secrets.GITHUB_TOKEN }}
