name: Publish TimeLink Player v1.1.3 across supported desktops
on:
  pull_request:
    paths:
      - '.github/workflows/publish-player-1.1.3.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-player-1.1.3.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify exact release version and deterministic package names
        run: |
          node -e "const p=require('./package.json');if(p.version!=='1.1.3')throw Error('version mismatch');if(p.build.mac.artifactName!=='TimeLink-Player-\u0024{version}-\u0024{arch}.\u0024{ext}')throw Error('mac package name mismatch');if(p.build.linux.artifactName!=='TimeLink-Player-\u0024{version}.\u0024{ext}')throw Error('Linux package name mismatch')"
  build:
    needs: verify
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            files: "dist/*.exe"
          - os: macos-latest
            platform: mac
            files: "dist/*.dmg"
          - os: ubuntu-24.04
            platform: linux
            files: "dist/*.AppImage\ndist/*.deb"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build unsigned desktop installers
        run: npx electron-builder --${{ matrix.platform }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: TimeLink-Player-1.1.3-${{ matrix.platform }}
          path: ${{ matrix.files }}
          if-no-files-found: error
  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: TimeLink-Player-1.1.3-*
          merge-multiple: true
          path: release
      - name: Verify release artifacts before publishing
        run: |
          test -f release/TimeLink-Player-Setup-1.1.3.exe
          ls release/*.dmg release/*.AppImage release/*.deb
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.3
          target_commitish: main
          name: TimeLink Player v1.1.3 - TL3 V5 header safety
          body: |
            Desktop release of TimeLink Player 1.1.3. Recognizes TLNK V5
            encrypted files without local decryption or fake TL balance edits.
            V5 protected songs open through the official online playback service,
            which separately checks login, rights, licenses and settlement.
            Windows installer and macOS/Linux builds are unsigned; install
            from this official TimeLink repository only.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          fail_on_unmatched_files: true
